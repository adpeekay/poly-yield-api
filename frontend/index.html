<div style="max-width: 900px; margin: 0 auto; padding: 1.5rem; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;">
 
  <h1 style="margin-bottom: 0.3rem;">PV Yield Calculator (Trial)</h1>
<p>Select a location on the map, then calculate indicative annual energy yield.</p>
 
  <div id="map" style="height: 400px; margin: 1rem 0; border: 1px solid #ccc; border-radius: 6px;"></div>
 
  <div>
<strong>Selected location:</strong>
<span id="coords">Click on the map</span>
</div>
 
  <div style="margin-top: 1rem;">
<button id="calcBtn" style="padding: 0.6rem 1.2rem; font-size: 1rem; cursor: pointer;">
      Calculate annual yield
</button>
</div>

<div style="margin-top: 1rem;">
  <label>
    Polytunnel curvature (°):
    <input type="range"
           id="curvature"
           min="30"
           max="80"
           step="2"
           value="60">
    <span id="curvVal">60</span>
  </label>
</div>

<div style="margin-top: 0.7rem;">
  <label>
    N–S land slope (°):
    <input type="range"
           id="slopeNS"
           min="-10"
           max="10"
           step="0.5"
           value="0">
    <span id="slopeVal">0</span>
  </label>
</div>

<div style="margin-top: 1rem;">
  <label>
    Number of panels:
    <input type="range"
           id="noPanels"
           min="5"
           max="400"
           step="5"
           value="10">
    <span id="panelVal">1</span>
  </label>
</div>

  <div id="status" style="margin-top: 0.7rem; font-style: italic;"></div>
<div id="result" style="margin-top: 1rem; font-size: 1.05rem;"></div>
 
  <div style="margin-top: 1.5rem; font-size: 0.85rem; color: #555;">
    Results are indicative and based on modelled assumptions.
</div>

<div style="margin-top: 1.5rem;">
  <canvas id="dailyChart" height="120"></canvas>
</div>


</div>
 
<!-- Leaflet (more stable CDN for Siteglide) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {
 
  // ===============================
  // CONFIG
  // ===============================
  const API_URL = "https://poly-yield-api.onrender.com/calculate";
  const DEFAULT_TIMEZONE = "UTC";
 
  // ===============================
  // STATE
  // ===============================
  let selectedLat = null;
  let selectedLon = null;
  let marker = null;
  let isRunning = false;
  let dailyChart = null;
 
  const btn = document.getElementById("calcBtn");
  const status = document.getElementById("status");
  const result = document.getElementById("result");
  const coords = document.getElementById("coords");

const noPanelsInput = document.getElementById("noPanels");
const panelVal = document.getElementById("panelVal");

const curvatureInput = document.getElementById("curvature");
const curvVal = document.getElementById("curvVal");

const slopeInput = document.getElementById("slopeNS");
const slopeVal = document.getElementById("slopeVal");

curvatureInput.addEventListener("input", () => {
  curvVal.textContent = curvatureInput.value;
});

slopeInput.addEventListener("input", () => {
  slopeVal.textContent = slopeInput.value;
});

noPanelsInput.addEventListener("input", () => {
  panelVal.textContent = noPanelsInput.value;
});
 
function plotDailyEnergy(dailyData) {
  const labels = dailyData.map(d => d.date);
  const values = dailyData.map(d => d.kwh);

  if (dailyChart) {
    dailyChart.destroy();
  }

  dailyChart = new Chart(
    document.getElementById("dailyChart"),
    {
      type: "line",
      data: {
        labels: labels,
        datasets: [{
          label: "Daily energy (kWh)",
          data: values,
          borderColor: "#1f77b4",
          backgroundColor: "rgba(31, 119, 180, 0.1)",
          pointRadius: 0,
          tension: 0.25
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: {
            display: false
          },
          y: {
            title: {
              display: true,
              text: "kWh / day"
            }
          }
        },
        plugins: {
          legend: {
            display: true
          }
        }
      }
    }
  );
}

  // ===============================
  // MAP INIT
  // ===============================
  const map = L.map("map").setView([20, 0], 2);
 
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "&copy; OpenStreetMap contributors"
  }).addTo(map);
 
  map.doubleClickZoom.disable();
 
  map.on("click", function (e) {
    selectedLat = e.latlng.lat;
    selectedLon = e.latlng.lng;
 
    if (marker) {
      marker.setLatLng(e.latlng);
    } else {
      marker = L.marker(e.latlng).addTo(map);
    }
 
    coords.textContent =
      selectedLat.toFixed(4) + ", " + selectedLon.toFixed(4);
 
    status.textContent = "";
    result.textContent = "";
  });
 
  // IMPORTANT: Fix map render in Siteglide
  setTimeout(() => {
    map.invalidateSize();
  }, 400);
 
  // ===============================
  // API CALL
  // ===============================
  async function calculateYield() {
    if (isRunning) return;
 
    if (selectedLat === null || selectedLon === null) {
      status.textContent = "Please select a location on the map.";
      return;
    }
 
    isRunning = true;
    btn.disabled = true;
    btn.textContent = "Calculating…";
    status.textContent = "Running yield model…";
    result.textContent = "";
 
    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          lat: selectedLat,
          lon: selectedLon,
          timezone: DEFAULT_TIMEZONE,
          no_panels: parseInt(noPanelsInput.value),        
          max_cell_tilt: parseInt(curvatureInput.value),
          slope_ns: parseFloat(slopeInput.value)

        })
      });
 
      if (!res.ok) throw new Error("API error: " + res.status);
 
      const data = await res.json();
 
      result.innerHTML = `
<strong>Annual energy:</strong> ${data.annual_kwh} kWh<br>
<strong>Yield:</strong> ${data.kwh_per_kwp} kWh/kWp
      `;
      if (data.daily_kwh) {
  plotDailyEnergy(data.daily_kwh);
}
 
      status.textContent = "Calculation complete ✅";
 
    } catch (err) {
      status.textContent = "Network error – please try again.";
    } finally {
      isRunning = false;
      btn.disabled = false;
      btn.textContent = "Calculate annual yield";
    }
  }
 
  btn.addEventListener("click", calculateYield);
 
});
</script>
